# docker-compose.bert-training.yml
# Docker Compose configuration for BERT training environment

version: '3.8'

services:
  bert-trainer:
    build: 
      context: ./backend
      dockerfile: Dockerfile.bert-training
    container_name: kairocal_bert_trainer
    environment:
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0  # Use GPU if available
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
    command: python app/scripts/train_bert_priority_model.py
    depends_on:
      - postgres
    networks:
      - kairocal-network

  postgres:
    image: postgres:15-alpine
    container_name: kairocal_postgres_training
    environment:
      POSTGRES_DB: kairocal
      POSTGRES_USER: kairocal_user
      POSTGRES_PASSWORD: Test123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_training_data:/var/lib/postgresql/data
    networks:
      - kairocal-network

  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: kairocal_tensorboard
    command: tensorboard --logdir=/logs --host=0.0.0.0 --port=6006
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/logs
    networks:
      - kairocal-network

volumes:
  postgres_training_data:

networks:
  kairocal-network:
    driver: bridge