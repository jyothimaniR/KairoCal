  - name: NLP
    description: Natural Language Processing and BERT classification
  - name: Analytics
    description: Analytics and insights endpoints
  - name: BERT
    description: BERT model performance and metrics
  - name: Conflicts
    description: Conflict detection and resolution
  - name: User Behavior
    description: User behavior analysis and recommendations
  - name: Users
    description: User management operations