# docker-compose.yml (compose v2+ – version key removed as it's obsolete)
services:
  postgres:
    image: postgres:15-alpine
    container_name: kairocal_postgres
    environment:
      POSTGRES_DB: kairocal
      POSTGRES_USER: kairocal_user
      POSTGRES_PASSWORD: Test123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-config/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairocal_user -d kairocal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kairocal-network

  redis:
    image: redis:7-alpine
    container_name: kairocal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kairocal-network

  backend:
    build: ./backend
    container_name: kairocal_backend
    environment:
      DATABASE_URL: postgresql://kairocal_user:Test123@postgres:5432/kairocal
      REDIS_URL: redis://redis:6379
      AWS_REGION: eu-west-2
      DEBUG: "true"
      COGNITO_USER_POOL_ID: ""
      COGNITO_APP_CLIENT_ID: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/requirements:/app/requirements
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
    networks:
      - kairocal-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:

networks:
  kairocal-network:
    driver: bridge